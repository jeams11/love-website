<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我们的空间</title>

<link rel="stylesheet" href="/static/css/main.css">

</head>


<body class="login-page">


<!-- 动态背景 -->

<div class="background">


    <!-- 空气感层 -->

    <div class="ambient"></div>



    <!-- 柔光 -->

    <div class="light light-one"></div>

    <div class="light light-two"></div>

    <div class="light light-three"></div>



    <!-- 星空 -->

    <div class="stars">


        <div class="star star-one"></div>

        <div class="star star-two"></div>

        <div class="star star-three"></div>

        <div class="star star-four"></div>

        <div class="star star-five"></div>

        <div class="star star-six"></div>

        <div class="star star-seven"></div>

        <div class="star star-eight"></div>


    </div>




    <!-- 动态流星 -->

    <div class="shooting-stars"></div>


</div>







<!-- 登录主体 -->

<main class="login-container">



    <section class="widget login-widget">



        <!-- Widget玻璃反光层 -->

        <div class="glass-shine"></div>





        <div class="space-title">



            <h1>

                我们的空间

            </h1>



            <p>

                一个只属于我们的地方

            </p>



        </div>







        <form method="POST">





            <div class="widget-input">


                <input

                type="text"

                name="username"

                placeholder="输入名字"

                autocomplete="off"

                required>


            </div>







            <div class="widget-input">


                <input

                type="password"

                name="password"

                placeholder="输入密码"

                required>


            </div>







            <button

            class="glass-button"

            type="submit">


                进入空间


            </button>






        </form>





    </section>






</main>







<script src="/static/js/app.js"></script>


</body>

</html>
